# Render blueprint for the guardian (render.com → New → Blueprint → this repo).
# Render asks for RPC_URL and ANTHROPIC_API_KEY when it creates the blueprint.
# The first deploy fails with "ENOENT ... /etc/secrets/guardian.json", because a
# blueprint can't carry secret files: add the guardian keypair under
# Environment → Secret Files as guardian.json, and saving it redeploys.
# guardian/README.md has the full steps. Render sets PORT itself.
services:
  - type: web
    name: vetowall-guardian
    runtime: node
    # A free instance sleeps when idle, and a sleeping guardian vetoes nothing.
    # It also can't mount the disk below. Starter is the smallest paid instance.
    plan: starter
    rootDir: guardian
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: CONFIG
        value: BQodWY1t1CVVJHpGdR9UnDg3wY3gyTsBDne5y2hSfTgp
      - key: GUARDIAN_KEYPAIR
        value: /etc/secrets/guardian.json
      - key: GUARDIAN_LOG
        value: /var/data/decisions.jsonl
      - key: RPC_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    # The log holds the text behind each onchain reason hash, so it must outlive restarts.
    disk:
      name: decisions
      mountPath: /var/data
      sizeGB: 1
